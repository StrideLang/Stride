language: cpp
dist: focal

os:
  - linux

compiler:
  - gcc
  - clang

env:
  global:
    - CTEST_OUTPUT_ON_FAILURE=1
    - QTEST_FUNCTION_TIMEOUT=3000000

git:
  submodules: true
  depth: false

addons:
  apt:
    packages:
      - cmake
      - flex
      - bison
      - llvm-14-dev
      - libllvm14
      - qt6-base-dev
      - libgl1-mesa-dev
      - libasound2-dev

before_script:
  - git submodule update --init --recursive
  - git clone --depth 1 -b 4.1.2 https://github.com/thestk/rtaudio.git strideroot/frameworks/RtAudio/1.0/project/rtaudio-4.1.2 || true

script:
  - cmake -B build -DCMAKE_BUILD_TYPE=Release -DSTRIDE_BUILD_EDITOR=OFF -DSTRIDE_BUILD_JIT=ON -DSTRIDE_BUILD_TESTS=ON -DLLVM_DIR=/usr/lib/llvm-14/lib/cmake/llvm
  - cmake --build build --config Release -j2
  - ctest --test-dir build --output-on-failure --verbose

notifications:
  recipients:
    - mantaraya36@gmail.com
  email:
    on_success: change
    on_failure: change
