name: Stride CI

on:
  push:
    branches: [ develop, master, main, presubmit ]
  pull_request:
    branches: [ develop, master, main, presubmit ]
  workflow_dispatch:
    inputs:
      build_editor:
        description: 'Build Stride IDE / Editor'
        type: boolean
        default: false

jobs:
  build-and-test:
    name: ${{ matrix.os }} (${{ matrix.compiler }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        compiler: [gcc, clang]
        build_type: [Release]

    env:
      STRIDEROOT: ${{ github.workspace }}/strideroot

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            flex \
            bison \
            llvm-18-dev \
            libllvm18 \
            clang-18 \
            libgl1-mesa-dev \
            libasound2-dev \
            ccache

      - name: Install Qt 6 (conditional for Editor)
        if: ${{ inputs.build_editor == true }}
        run: |
          sudo apt-get install -y qt6-base-dev qt6-declarative-dev

      - name: Setup CCache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}

      - name: Fetch RtAudio Framework Dependency
        run: |
          mkdir -p strideroot/frameworks/RtAudio/1.0/project
          git clone --depth 1 -b 4.1.2 https://github.com/thestk/rtaudio.git strideroot/frameworks/RtAudio/1.0/project/rtaudio-4.1.2 || true

      - name: Configure CMake
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            export CC=clang-18
            export CXX=clang++-18
          else
            export CC=gcc
            export CXX=g++
          fi

          BUILD_EDITOR="OFF"
          if [ "${{ inputs.build_editor }}" = "true" ]; then
            BUILD_EDITOR="ON"
          fi

          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSTRIDE_BUILD_EDITOR=${BUILD_EDITOR} \
            -DSTRIDE_BUILD_JIT=ON \
            -DSTRIDE_BUILD_TESTS=ON \
            -DSTRIDEJIT_BUILD_TESTS=ON \
            -DSTRIDEPARSER_BUILD_TESTS=ON \
            -DSTRIDEROOT="${{ github.workspace }}/strideroot" \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DCMAKE_PREFIX_PATH=/usr/lib/llvm-18 \
            # -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \


      - name: Build Stride
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Run Tests
        env:
          CTEST_OUTPUT_ON_FAILURE: 1
          QTEST_FUNCTION_TIMEOUT: 3000000
          # ASAN_OPTIONS: "halt_on_error=1:fast_unwind_on_malloc=0"
        run: ctest --test-dir build --output-on-failure --verbose

      - name: Run Library Unit Tests (CLI Suite)
        run: |
          ./build/stridejit/stridetest "${{ env.STRIDEROOT }}/library/1.0/tests" --root "${{ env.STRIDEROOT }}" --verbose

      - name: Print Stack Traces from Core Dumps
        if: failure()
        run: |
          shopt -s nullglob
          cores=(/tmp/core-*)

          if [ ${#cores[@]} -eq 0 ]; then
            echo "No core dumps found. The test failure may be an assertion or exit code rather than a crash."
            exit 0
          fi

          for core in "${cores[@]}"; do
            echo "===================================================="
            echo "Extracting backtrace for dump: $core"
            echo "===================================================="

            # Determine executable name from the core file
            EXECUTABLE=$(gdb -batch -c "$core" 2>&1 | grep -oP 'generated by `\K[^'\'']+' || true)

            if [ -n "$EXECUTABLE" ] && [ -f "$EXECUTABLE" ]; then
              gdb -batch -ex "thread apply all bt full" "$EXECUTABLE" "$core"
            else
              # Fallback: inspect the core dump directly if binary path isn't deduced
              gdb -batch -ex "thread apply all bt full" -c "$core"
            fi
          done
